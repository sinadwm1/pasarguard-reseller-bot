[project]
name = "pasarguard-reseller-bot"
version = "1.6.0"
description = "Telegram-first sales and reseller management for PasarGuard"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.30,<4",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=45,<47",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "redis>=6,<7",
  "sqlalchemy[asyncio]>=2.0.43,<3",
]

[project.optional-dependencies]
dev = ["ruff>=0.12,<1"]

[project.scripts]
pasarbot = "pasarbot.main:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/runtime_smoke.py" = ["S106"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pasarbot"]
